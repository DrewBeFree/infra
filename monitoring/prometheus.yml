  global:
    scrape_interval: 15s
    evaluation_interval: 15s
    external_labels:
      monitor: 'atlas-monitor'

  alerting:
    alertmanagers:
      - static_configs:
          - targets: []

  rule_files:
    - "alert.rules.yml"

  scrape_configs:
    - job_name: 'prometheus'
      static_configs:
        - targets: ['localhost:9090']

    - job_name: 'node'
      static_configs:
        - targets: ['node-exporter:9100']

    - job_name: 'smartctl'
      static_configs:
        - targets: ['smartctl-exporter:9633']
      scrape_interval: 60s

    - job_name: 'cadvisor'
      static_configs:
        - targets: ['cadvisor:8080']

    - job_name: 'ollama'
      static_configs:
        - targets: ['ollama-exporter:9642']
      scrape_interval: 30s

    - job_name: "ipmi"
      scrape_interval: 30s
      metrics_path: /ipmi
      params:
         target: ["localhost"]
      static_configs:
         - targets: ["host.docker.internal:9290"]

    - job_name: 'benchmarks'
      static_configs:
        - targets: ['host.docker.internal:9700']
      scrape_interval: 60s

    - job_name: 'nvidia_gpu'
      static_configs:
        - targets: ['host.docker.internal:9701']
      scrape_interval: 15s

    - job_name: 'apcupsd'
      static_configs:
        - targets: ['host.docker.internal:9162']
      scrape_interval: 15s

