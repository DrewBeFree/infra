global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'atlas-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'node_cpu.*'
        action: keep

  - job_name: 'smartctl'
    static_configs:
      - targets: ['localhost:9633']
    scrape_interval: 60s

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['localhost:8080']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'container_.*|machine_.*'
        action: keep

  - job_name: 'ollama'
    static_configs:
      - targets: ['localhost:9642']
    scrape_interval: 30s
