<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homelab Status</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #050a0e;
  --bg2:       #080f14;
  --panel:     #0a1520;
  --border:    #0d2535;
  --accent:    #00d4ff;
  --accent2:   #00ff88;
  --accent3:   #ff6b35;
  --text:      #c8e8f0;
  --text-dim:  #3a6070;
  --text-mid:  #6a9ab0;
  --glow:      rgba(0,212,255,0.12);
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  min-height: 100vh;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(0,212,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.02) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none; z-index: 0;
}

.wrap { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 24px 80px; }

/* ── Header ── */
header {
  padding: 36px 0 28px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 36px;
  display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 16px;
}
.header-left {}
.eyebrow { font-size: 0.62rem; color: var(--accent); letter-spacing: 4px; text-transform: uppercase; margin-bottom: 6px; }
h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(1.4rem, 4vw, 2.2rem);
  font-weight: 700; color: #fff; letter-spacing: 2px;
}
h1 span { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 16px; }
#last-fetched { font-size: 0.65rem; color: var(--text-dim); letter-spacing: 2px; }
#refresh-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase;
  background: transparent; color: var(--accent);
  border: 1px solid var(--accent); border-radius: 2px;
  padding: 6px 14px; cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
#refresh-btn:hover { background: var(--accent); color: var(--bg); }

/* ── Section label ── */
.section-label {
  font-size: 0.6rem; color: var(--text-dim); letter-spacing: 4px;
  text-transform: uppercase; margin-bottom: 14px;
  display: flex; align-items: center; gap: 12px;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ── Status row ── */
.status-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 36px;
}
@media (max-width: 720px) { .status-row { grid-template-columns: 1fr; } }

/* ── Panel ── */
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 20px;
  position: relative;
}
.panel::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0.4;
}
.panel-title {
  font-size: 0.6rem; color: var(--accent); letter-spacing: 4px;
  text-transform: uppercase; margin-bottom: 16px;
  padding-bottom: 10px; border-bottom: 1px solid var(--border);
}

/* ── Last Session ── */
.session-date {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.8rem; color: var(--accent2);
  letter-spacing: 2px; margin-bottom: 14px;
}
.session-block { margin-bottom: 12px; }
.session-block-label {
  font-size: 0.58rem; color: var(--text-dim);
  letter-spacing: 3px; text-transform: uppercase; margin-bottom: 5px;
}
.session-block ul { list-style: none; padding: 0; }
.session-block li {
  font-family: 'Exo 2', sans-serif;
  font-size: 0.78rem; color: var(--text-mid);
  line-height: 1.6; padding: 2px 0;
  padding-left: 12px; position: relative;
}
.session-block li::before {
  content: '›'; position: absolute; left: 0;
  color: var(--text-dim);
}

/* ── Up Next ── */
.up-next-item {
  display: flex; gap: 10px; align-items: baseline;
  padding: 7px 0; border-bottom: 1px solid var(--border);
}
.up-next-item:last-child { border-bottom: none; }
.up-next-repo {
  font-size: 0.55rem; letter-spacing: 2px; text-transform: uppercase;
  color: var(--accent); flex-shrink: 0;
  border: 1px solid var(--border);
  padding: 2px 6px; border-radius: 2px;
  white-space: nowrap;
}
.up-next-text {
  font-family: 'Exo 2', sans-serif;
  font-size: 0.78rem; color: var(--text-mid); line-height: 1.5;
}

/* ── Backlog accordion ── */
details.bl-repo {
  border: 1px solid var(--border);
  border-radius: 3px;
  margin-bottom: 6px;
  background: var(--panel);
}
details.bl-repo[open] { border-color: rgba(0,212,255,0.25); }
summary.bl-summary {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 16px; cursor: pointer;
  list-style: none; user-select: none;
  transition: background 0.15s;
}
summary.bl-summary::-webkit-details-marker { display: none; }
summary.bl-summary:hover { background: var(--bg2); }
.bl-repo-name {
  font-size: 0.7rem; letter-spacing: 2px; color: var(--text);
}
details[open] .bl-repo-name { color: var(--accent); }
.bl-open-count {
  font-size: 0.58rem; letter-spacing: 2px;
  color: var(--text-dim);
  border: 1px solid var(--border);
  padding: 2px 8px; border-radius: 2px;
}
details[open] .bl-open-count { color: var(--accent2); border-color: rgba(0,255,136,0.3); }

.bl-body { padding: 4px 16px 14px; }
.bl-section { margin-bottom: 10px; }
.bl-section-label {
  font-size: 0.55rem; letter-spacing: 3px; text-transform: uppercase;
  color: var(--text-dim); margin: 10px 0 5px;
}
.bl-section ul { list-style: none; padding: 0; }
.bl-section li {
  font-family: 'Exo 2', sans-serif;
  font-size: 0.76rem; color: var(--text-mid);
  padding: 3px 0 3px 12px; position: relative;
}
.bl-section li::before { content: '›'; position: absolute; left: 0; color: var(--text-dim); }
.bl-section li.done { color: var(--text-dim); text-decoration: line-through; }
.bl-section li.done::before { content: '✓'; color: var(--text-dim); font-size: 0.6rem; }

/* ── Utility ── */
.empty, .loading {
  font-size: 0.7rem; color: var(--text-dim);
  letter-spacing: 2px; font-style: normal;
}
.loading::after { content: '...'; animation: dots 1.2s step-end infinite; }
@keyframes dots { 0%,100%{content:'...'} 33%{content:'.'} 66%{content:'..'} }
.error { font-size: 0.7rem; color: var(--accent3); letter-spacing: 1px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="header-left">
      <div class="eyebrow">Drew Webb // ATL, GA</div>
      <h1>HOMELAB <span>STATUS</span></h1>
    </div>
    <div class="header-right">
      <span id="last-fetched"></span>
      <button id="refresh-btn">↺ Refresh</button>
    </div>
  </header>

  <div class="section-label">Current State</div>
  <div class="status-row">
    <div class="panel">
      <div class="panel-title">Last Session</div>
      <div id="last-session"><p class="loading">Loading</p></div>
    </div>
    <div class="panel">
      <div class="panel-title">Up Next</div>
      <div id="up-next"><p class="loading">Loading</p></div>
    </div>
  </div>

  <div class="section-label">Backlogs</div>
  <div id="backlog"><p class="loading">Loading</p></div>

</div>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="render.js"></script>
</body>
</html>
